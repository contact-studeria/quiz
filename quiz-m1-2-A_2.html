:root{--purple:#7b1ad5;--violet:#a155f8;--light:#e8bbff;--ul:#f5dcff;--ink:#0f0038;--soft:#4a4a6a;--muted:#8a87a3;--line:#e6e1f2;--bg:#f6f2ff;
 --em:#10b981;--em-l:#d9f7ec;--rose:#f43f5e;--rose-l:#ffe1e7;--amber:#f59e0b;--teal:#06b6d4;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Gilroy,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45}
.bgdeco i:nth-child(1){width:380px;height:380px;background:#e8bbff;left:-120px;top:-100px}
.bgdeco i:nth-child(2){width:320px;height:320px;background:#c7f0ff;right:-120px;top:30%}
.bgdeco i:nth-child(3){width:300px;height:300px;background:#ffd9ef;left:20%;bottom:-160px}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 40px;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,rgba(246,242,255,0))}
.top .lg{background:var(--ink);border-radius:10px;padding:7px 10px;display:flex}
.top .lg img{height:16px;display:block}
.top .tt{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ct{font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
.seg{display:flex;gap:4px;margin:2px 0 14px}
.seg i{flex:1;height:7px;border-radius:99px;background:#e2dcf0;transition:background .3s}
.seg i.cur{background:linear-gradient(90deg,var(--purple),var(--violet))}
.seg i.ok{background:var(--em)}.seg i.ko{background:var(--rose)}.seg i.cert{max-width:22px;background:repeating-linear-gradient(45deg,#e2dcf0 0 3px,#cfc5ea 3px 6px)}
.seg i.cert.ok{background:var(--em)}.seg i.cert.ko{background:var(--rose)}

/* screens */
.screen{animation:in .45s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:24px;box-shadow:0 18px 50px rgba(60,20,120,.12),0 2px 0 rgba(123,26,213,.06);overflow:hidden}

/* hero */
.hero{background:radial-gradient(120% 90% at 100% 0%,#3a0d7a 0%,var(--ink) 60%);color:#fff;padding:26px 22px 24px;position:relative;overflow:hidden}
.hero .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--light)}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.05;margin:10px 0 10px;font-weight:700}
.hero h1 span{background:linear-gradient(90deg,#e8bbff,#ffb3d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:rgba(255,255,255,.75);font-size:15.5px;max-width:470px}
.hero .bot{position:absolute;right:-6px;bottom:-8px;font-size:84px;opacity:.95;transform:rotate(-8deg);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-4deg) translateY(-8px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;max-width:470px}
.chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.camille{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffd6b8,#f6b48e);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--light)}
.camille p{font-size:14.5px;color:var(--soft)}
.camille b{color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px}
.rules div{background:var(--bg);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--soft);font-weight:600;line-height:1.3}
.rules b{display:block;font-size:22px;color:var(--purple)}
.cta{padding:4px 20px 22px;display:flex;justify-content:center}
.btn{border:0;border-radius:999px;min-height:54px;padding:0 30px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--violet));box-shadow:0 10px 26px rgba(123,26,213,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,box-shadow .2s;display:inline-flex;align-items:center;gap:10px}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(123,26,213,.42)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:inset 0 0 0 2px var(--light)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* question */
.qhead{padding:18px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-size:13px;font-weight:700;color:#fff;background:var(--ink);border-radius:9px;padding:4px 9px}
.obj{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);background:var(--ul);border-radius:999px;padding:5px 11px}
.obj.cert{color:#8a5a00;background:#fff1cc}
.qtitle{font-size:21px;font-weight:700;line-height:1.25;padding:10px 20px 0}
.scene{margin:14px 20px 0;border-radius:18px;background:linear-gradient(160deg,#faf7ff,#f1e9ff);border:1px solid var(--line);padding:14px;position:relative;overflow:hidden}
.intro{font-size:15.5px;color:var(--soft);padding:14px 20px 0}
.qq{font-size:18px;font-weight:700;padding:12px 20px 4px;line-height:1.35}
.opts{display:grid;gap:10px;padding:12px 20px 20px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-size:15.5px;line-height:1.38;font-weight:500;transition:border-color .15s,transform .12s,box-shadow .15s,background .2s;position:relative}
.opt:hover:not([disabled]){border-color:var(--violet);box-shadow:0 6px 18px rgba(123,26,213,.12);transform:translateY(-1px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;background:var(--ul);color:var(--purple);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .2s,color .2s}
.opt .tx{padding-top:4px}
.opts.tf .opt{flex-direction:column;align-items:center;text-align:center;padding:18px 10px;font-size:20px;font-weight:700}
.opts.tf .opt .l{width:48px;height:48px;border-radius:14px;font-size:26px}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
.opt.good{border-color:var(--em);background:var(--em-l);opacity:1}
.opt.good .l{background:var(--em);color:#fff}
.opt.bad{border-color:var(--rose);background:var(--rose-l);animation:shake .4s;opacity:1}
.opt.bad .l{background:var(--rose);color:#fff}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opt .tag{position:absolute;right:10px;top:-11px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:var(--em);box-shadow:0 4px 10px rgba(16,185,129,.35)}
.opt.bad .tag{background:var(--rose);box-shadow:0 4px 10px rgba(244,63,94,.35)}
.fb{margin:0 20px 20px;border-radius:18px;padding:14px 16px;animation:in .4s both}
.fb.ok{background:linear-gradient(135deg,#e7fbf3,#d3f5e8);border:1.5px solid #9fe8c9}
.fb.ko{background:linear-gradient(135deg,#fff1f3,#ffe3e9);border:1.5px solid #ffb8c5}
.fb h4{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb p{font-size:15px;color:#2a2550;line-height:1.5}
.fb p b{color:var(--purple)}
.fb .nx{display:flex;justify-content:flex-end;margin-top:12px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:0 20px 16px}

/* scènes illustrées */
.win{background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(30,10,80,.1);overflow:hidden}
.win .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#f3eefc;font-size:12px;font-weight:700;color:var(--soft)}
.win .bar i{width:9px;height:9px;border-radius:50%;background:#ff7a90}.win .bar i:nth-child(2){background:#ffc940}.win .bar i:nth-child(3){background:#3ddc97}
.win .bar span{margin-left:6px}
.inp{display:flex;align-items:flex-end;gap:8px;padding:10px}
.inp div{flex:1;background:#f8f6fd;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.4}
.send{width:34px;height:34px;border-radius:10px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.caret{display:inline-block;width:2px;height:15px;background:var(--purple);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.msgs{padding:10px;display:grid;gap:8px}
.m{max-width:85%;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.35;position:relative}
.m.u{justify-self:end;background:var(--purple);color:#fff;border-bottom-right-radius:4px}
.m.a{justify-self:start;background:#f1edf9;color:var(--ink);border-bottom-left-radius:4px}
.m .ic{position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:12px}
.tool{display:flex;gap:6px;justify-content:flex-start;padding:0 10px 10px}
.tool span{font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--soft)}
.count{position:absolute;right:12px;top:12px;font-size:12px;font-weight:700;background:var(--rose);color:#fff;border-radius:999px;padding:3px 9px}
.mail{background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(30,10,80,.1);font-size:13px;line-height:1.45;overflow:hidden}
.mail .h{padding:8px 11px;border-bottom:1px solid var(--line);color:var(--soft)}
.mail .h b{color:var(--ink)}
.mail .b{padding:9px 11px}
.hl{background:#fff1b8;border-radius:4px;padding:0 3px;font-weight:700;box-shadow:0 0 0 2px #ffe08a}
.dim2{color:#b4afc9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .lab{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.pr{background:#fff;border-radius:10px;padding:8px 9px;font-size:12.5px;line-height:1.35;box-shadow:0 3px 10px rgba(30,10,80,.08);margin-bottom:6px}
.arrow{text-align:center;color:var(--violet);font-size:16px;line-height:1}
.acc{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.acc span{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;color:#0f0038}
.note{background:#fff7b0;border-radius:4px 4px 14px 4px;padding:12px 13px;font-size:14px;font-weight:600;transform:rotate(-2deg);box-shadow:0 8px 16px rgba(120,90,0,.18);position:relative;line-height:1.4;font-family:inherit}
.note:before{content:"";position:absolute;top:-8px;left:50%;width:46px;height:16px;margin-left:-23px;background:rgba(255,255,255,.7);transform:rotate(3deg)}
.doc{display:flex;gap:12px;align-items:center}
.paper{width:78px;height:96px;border-radius:8px;background:#fff;box-shadow:4px 4px 0 #e6dcfa,8px 8px 0 #d9cbf7;padding:9px 8px;flex:none}
.paper i{display:block;height:4px;border-radius:2px;background:#e3dcf3;margin-bottom:6px}
.paper i:nth-child(3n){width:70%}
.paper b{display:block;font-size:10px;color:var(--purple);margin-top:4px}
.slack{display:flex;gap:10px;align-items:flex-start}
.slack .av2{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7ec8ff,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.slack .bd{background:#fff;border-radius:4px 14px 14px 14px;padding:9px 11px;font-size:13.5px;box-shadow:0 4px 12px rgba(30,10,80,.08);flex:1}
.slack .bd .nm{font-size:12px;font-weight:700;color:var(--purple)}
.code{margin-top:7px;background:var(--ink);color:#e8bbff;border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.4}
.board{background:#fff;border:6px solid #cfd6e3;border-radius:10px;padding:12px;position:relative;min-height:120px}
.board svg{width:100%;height:110px;display:block}
.cam{position:absolute;right:10px;bottom:-14px;background:var(--ink);color:#fff;border-radius:14px;padding:6px 10px;font-size:20px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.mic{display:flex;align-items:center;gap:14px}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:54px}
.wave i{flex:1;border-radius:3px;background:linear-gradient(var(--violet),var(--purple));animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.big{font-size:44px;line-height:1}
.pile{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pile .clock{font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:5px 10px;box-shadow:0 3px 10px rgba(30,10,80,.08)}
.vs{display:flex;align-items:center;gap:12px;justify-content:center}
.vs .bx{background:#fff;border-radius:14px;padding:10px 12px;text-align:center;box-shadow:0 4px 12px rgba(30,10,80,.08);font-size:13px;font-weight:600}
.vs .bx .big{margin-bottom:4px}
.quote{background:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;box-shadow:0 4px 12px rgba(30,10,80,.08);position:relative;font-style:italic}
.quote:before{content:"“";position:absolute;left:8px;top:-14px;font-size:54px;color:var(--violet);font-style:normal;line-height:1}

/* résultat */
.res{padding:24px 20px 8px;text-align:center}
.gauge{width:190px;height:190px;margin:4px auto 6px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-size:56px;line-height:1;font-weight:700}
.gauge .v span{font-size:14px;color:var(--muted);font-weight:600}
.res h2{font-size:26px;margin:6px 0 4px}
.res p{color:var(--soft);font-size:15.5px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:700;border-radius:999px;padding:7px 14px}
.badge.ok{background:var(--em-l);color:#057a52}.badge.ko{background:#fff1cc;color:#8a5a00}
.rev{padding:8px 20px 4px}
.rev h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 8px}
.ri{border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;background:#fff}
.ri summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;font-weight:600;font-size:14.5px}
.ri summary::-webkit-details-marker{display:none}
.ri summary .st{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ri.ok .st{background:var(--em)}.ri.ko .st{background:var(--rose)}
.ri summary .ch{margin-left:auto;color:var(--muted);transition:transform .2s}
.ri[open] summary .ch{transform:rotate(90deg)}
.ri .rb{padding:0 12px 12px 48px;font-size:14px;color:var(--soft);line-height:1.5}
.ri .rb .ans{color:#057a52;font-weight:700;display:block;margin-bottom:4px}
.ri .rb b{color:var(--purple)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:18px 10px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:420px){.qtitle{font-size:19px}.qq{font-size:17px}.opt{font-size:15px}.rules{grid-template-columns:1fr 1fr 1fr;gap:6px}.rules div{font-size:12px;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const Q=[{"n": "01", "obj": "O1", "titre": "Ce qui manque dans la demande", "intro": "Vous relisez cette demande avant de l'envoyer à votre outil IA :", "cite": "Rédige un mail de relance pour une facture impayée. Ton ferme mais cordial, vouvoiement, 150 mots maximum.", "q": "Qu'est-ce qui manque pour obtenir un mail que vous pourrez vraiment envoyer ?", "opts": ["Le contexte : le client, la facture, l'historique de la relance", "L'action : « rédige » est trop vague pour un mail professionnel", "Les contraintes de forme : il faudrait préciser la structure du mail", "Rien : la demande contient déjà les trois morceaux de la méthode"], "bonne": 0, "expl": "L'action et les contraintes de forme sont bien là. C'est le <b>contexte<\/b> qui manque : sans le nom du client, le montant, l'ancienneté de la facture et le fait que ce soit la deuxième relance, l'IA ne peut produire qu'un mail générique avec des crochets à remplir.", "lab": "Méthode A.C.C."}, {"n": "02", "obj": "O5", "titre": "Le contexte empêche-t-il les erreurs ?", "intro": "Vrai ou faux ?", "cite": null, "q": "Si vous donnez un contexte complet et précis, l'IA n'inventera plus de chiffre ni de référence.", "opts": ["Vrai", "Faux"], "bonne": 1, "expl": "Le contexte <b>réduit<\/b> le risque, il ne le supprime pas. L'IA peut annoncer un taux de pénalité ou un article de loi inventé avec exactement la même assurance qu'un fait vérifié. D'où la relecture systématique avant envoi.", "lab": "Repasser derrière"}, {"n": "03", "obj": "O1", "titre": "Où classer une consigne", "intro": "Vous demandez le résumé d'un compte rendu de réunion de douze pages pour votre direction, et vous précisez : « trois paragraphes maximum, ton neutre, pas de puces ».", "cite": null, "q": "Dans la méthode A.C.C., à quoi correspond cette précision ?", "opts": ["À l'action, puisqu'elle dit comment rédiger le résumé", "Au contexte, puisqu'elle précise pour qui vous écrivez", "Aux contraintes de fond, puisqu'elle encadre le contenu retenu", "Aux contraintes de forme, puisqu'elle décrit l'aspect du résultat"], "bonne": 3, "expl": "Les <b>contraintes de forme<\/b> portent sur le ton, le format et la longueur. Les contraintes de fond, elles, portent sur les sources à utiliser et sur ce qui doit être exact.", "lab": "Méthode A.C.C."}, {"n": "04", "obj": "O2", "titre": "Ce qui a changé pour Camille", "intro": "Camille a d'abord écrit « Fais-moi un mail de relance », puis la même demande découpée en A.C.C. Le second mail est utilisable, le premier non. L'action était pourtant identique dans les deux cas.", "cite": null, "q": "Qu'est-ce qui explique l'écart ?", "opts": ["La seconde est plus longue, donc l'IA la traite plus sérieusement", "La seconde emploie une formulation plus polie, que l'IA reconnaît mieux", "La seconde donne les informations sur la situation : l'entreprise, le client, la facture, l'historique", "La seconde attribue un rôle à l'IA, ce qui déclenche une réponse d'expert"], "bonne": 2, "expl": "Ce n'est ni la longueur ni la politesse : c'est le <b>contexte<\/b>. Dans A.C.C., cette lettre-là pèse plus que les deux autres réunies.", "lab": "Le contexte"}, {"n": "05", "obj": "O2", "titre": "Le prompt trouvé en ligne", "intro": "Un collègue vous envoie un prompt tout fait, récupéré dans une banque de prompts. Chez lui, il donne d'excellents résultats.", "cite": null, "q": "Qu'en faites-vous ?", "opts": ["Vous le prenez comme base, puis vous y ajoutez votre situation", "Vous le copiez tel quel : il est déjà éprouvé chez votre collègue", "Vous l'écartez : un prompt tout fait ne peut pas fonctionner chez vous", "Vous lui demandez la réponse qu'il a obtenue, pour la réutiliser"], "bonne": 0, "expl": "Une banque de prompts donne de bonnes idées de structure, mais <b>un prompt tout fait ne sait rien de votre entreprise<\/b>. C'est un point de départ, comme une recette qu'on adapte à ce qu'on a dans son frigo.", "lab": "Le contexte"}, {"n": "06", "obj": "O3", "titre": "La réponse est à côté", "intro": "Vous avez écrit une demande un peu floue et la réponse ne correspond pas à votre besoin. Vous voulez relancer proprement.", "cite": null, "q": "Quel geste choisissez-vous ?", "opts": ["Vous répondez en dessous pour préciser ce que vous vouliez", "Vous régénérez la réponse pour en obtenir une autre version", "Vous ouvrez une nouvelle conversation et vous recommencez de zéro", "Vous corrigez votre message avec l'icône crayon et vous le renvoyez complété"], "bonne": 3, "expl": "Quand c'est la demande qui était floue, <b>on corrige la demande<\/b>. En modifiant votre message, la version ratée sort du fil : l'IA ne la relit plus. Si vous répondez en dessous, elle reste dans ce qu'elle relit à chaque réponse.", "lab": "Itérer"}, {"n": "07", "obj": "O3", "titre": "Au troisième échange", "intro": "Vous en êtes au troisième aller-retour et la réponse ne convient toujours pas.", "cite": null, "q": "Que faites-vous ?", "opts": ["Vous reformulez une quatrième fois, en étant plus directif", "Vous cherchez ce qu'elle ne sait pas de votre situation, et vous le lui donnez", "Vous régénérez jusqu'à tomber sur une version correcte", "Vous changez d'outil : celui-ci ne comprend visiblement pas votre demande"], "bonne": 1, "expl": "Le bon repère est une réponse exploitable en <b>un ou deux échanges<\/b>. Au troisième, le problème n'est presque jamais la formulation : c'est du contexte qui manque.", "lab": "Itérer"}, {"n": "08", "obj": "O4", "titre": "Cinq minutes d'explications", "intro": "Votre dossier est complexe et il vous faudrait cinq bonnes minutes d'explications pour poser le contexte. Taper tout ça vous décourage d'avance.", "cite": null, "q": "Quelle est la bonne façon de faire ?", "opts": ["Résumer en deux phrases : l'IA complétera ce qui manque", "Découper la demande en plusieurs messages courts successifs", "Dicter vos explications à l'oral, puis relire ce que l'IA en a tiré", "Attendre d'avoir le temps de rédiger la demande correctement"], "bonne": 2, "expl": "Donner du contexte ne veut pas dire taper des pages. La <b>dictée<\/b> vous permet de parler plusieurs minutes, l'IA remet de l'ordre — et vous relisez ensuite, comme toujours.", "lab": "Donner sans taper"}, {"n": "09", "obj": "O4", "titre": "Un tableau manuscrit", "intro": "À la fin d'un atelier, vous avez un tableau blanc rempli de notes manuscrites que vous voulez faire mettre au propre.", "cite": null, "q": "Quelle solution demande le moins de travail et donne le meilleur résultat ?", "opts": ["Prendre une photo du tableau et la joindre à votre demande", "Décrire le tableau à l'écrit, ligne par ligne", "Recopier les notes dans un document, puis coller le document", "Demander à l'IA de deviner la structure à partir du sujet de l'atelier"], "bonne": 0, "expl": "La photo, la capture d'écran et le document joint remplacent la ressaisie. C'est le même principe que la dictée : <b>moins taper, plus donner<\/b>.", "lab": "Donner sans taper"}, {"n": "10", "obj": "O5", "titre": "Avant d'envoyer", "intro": "L'IA vient de rédiger la relance de Camille. Le mail est bon, le ton est juste, il part dans cinq minutes au client.", "cite": null, "q": "Que relisez-vous en priorité ?", "opts": ["La longueur et la mise en forme, pour vérifier les 150 mots", "Le ton, pour vérifier qu'il reste cordial malgré la fermeté", "L'orthographe et la grammaire, que l'IA peut avoir manquées", "Les chiffres, les noms et les références : montant, facture, dates, textes cités"], "bonne": 3, "expl": "L'IA propose, <b>vous validez<\/b>. Un ton raté se voit tout de suite ; un numéro de facture faux ou un article de loi inventé, non — et c'est ce qui part en votre nom.", "lab": "Repasser derrière"}, {"n": "11", "obj": "O1 · O2", "certif": true, "titre": "Question banque certification", "intro": "Un collaborateur vous explique sa méthode : « Je garde toujours le même prompt type, bien écrit, et je le réutilise pour toutes mes relances clients. Comme ça je gagne du temps. »", "cite": null, "q": "Qu'est-ce qui cloche dans ce raisonnement ?", "opts": ["Rien : réutiliser une formulation éprouvée est la bonne pratique", "Il faut varier les formulations, sinon l'IA produit toujours le même texte", "Un prompt type ne porte que la formulation ; ce qui change d'un dossier à l'autre, c'est le contexte", "Un prompt réutilisé finit par entraîner l'IA sur ses données clients"], "bonne": 2, "expl": "La formulation compte de moins en moins, le contexte de plus en plus. Un prompt type est une base utile, mais sans le client, la facture et l'historique de chaque dossier, il redonnera <b>un mail correct pour personne<\/b>. La dernière option décrit par ailleurs une crainte infondée : l'IA ne s'entraîne pas sur vous pendant la conversation.", "lab": "A.C.C. et contexte"}];

 app.innerHTML=top(lbl)+seg()+`<section class="screen card" aria-labelledby="qq">
 <div class="qhead"><span class="num">${q.certif?'★':'Q'+q.n}</span><span class="obj ${q.certif?'cert':''}">🎯 ${q.certif?'Banque certification':q.lab}</span></div>
 <h2 class="qtitle">${q.titre}</h2>
 ${SCN[q.n]?'<div class="scene" aria-hidden="true">'+SCN[q.n]()+'</div>':''}
 <p class="intro">${q.intro}${q.cite&&!SCN[q.n]?'<br><i>« '+q.cite+' »</i>':''}</p>
 <p class="qq" id="qq">${q.q}</p>
 <div class="opts ${isTF?'tf':''}" role="group" aria-label="Réponses">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${isTF?(k===0?'👍':'👎'):L[k]}</span><span class="tx">${o}</span></button>`).join('')}</div>
 <div id="fbx"></div>${q.certif?'<p class="hint">Cette question prépare la certification : elle ne compte pas dans le score du quiz.</p>':'<p class="hint">Astuce clavier : touches A, B, C, D (ou 1 à 4).</p>'}</section>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));window.scrollTo({top:0,behavior:'smooth'})}
function answer(k){if(S.locked)return;S.locked=true;const all=[...MAIN,CERT],q=all[S.i],ok=k===q.bonne;S.ans[q.n]=k;
 const bs=[...app.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.bonne){b.classList.add('good');b.insertAdjacentHTML('beforeend','<span class="tag">✅ Bonne réponse</span>')}else if(j===k){b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="tag">Votre choix</span>')}else b.classList.add('dim')});
 const last=S.i===all.length-1;
 $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'ko'}" role="status"><h4>${ok?'✅ Bien vu !':'💡 Pas tout à fait'}</h4><p>💬 ${q.expl}</p><div class="nx"><button class="btn" id="nx">${last?'Voir mon résultat':'Question suivante'} <span aria-hidden="true">→</span></button></div></div>`;
 app.querySelector('.seg').outerHTML=seg();
 if(ok)burst(18);
 const nx=$('#nx');nx.onclick=()=>last?result():show(S.i+1);setTimeout(()=>{nx.focus({preventScroll:true});$('#fbx').scrollIntoView({behavior:'smooth',block:'nearest'})},250)}
function result(){S.i=99;const sc=MAIN.filter(q=>S.ans[q.n]===q.bonne).length,pass=sc>=8,cOk=S.ans[CERT.n]===CERT.bonne;
 const C=2*Math.PI*80,frac=sc/MAIN.length;
 app.innerHTML=top('Résultat')+seg()+`<section class="screen card"><div class="res">
 <div class="gauge"><svg viewBox="0 0 190 190" aria-hidden="true"><circle cx="95" cy="95" r="80" fill="none" stroke="#eee8f8" stroke-width="16"/>
 <circle cx="95" cy="95" r="80" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="3 ${C}" stroke-dashoffset="${-C*.8+1.5}"/>
 <circle id="arc" cx="95" cy="95" r="80" fill="none" stroke="${pass?'#10b981':'#a155f8'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 ${C}" style="transition:stroke-dasharray 1.1s cubic-bezier(.3,.8,.3,1)"/></svg>
 <div class="v"><b id="scv">0</b><span>sur ${MAIN.length}</span></div></div>
 <h2>${pass?'Quiz validé 🎉':'Encore un petit effort'}</h2>
 <p>${pass?'Vous avez atteint le seuil de 8/10 : la leçon suivante est débloquée.':'Il faut 8/10 pour débloquer la suite. Relisez les explications ci-dessous puis retentez : c\'est illimité.'}</p>
 <span class="badge ${cOk?'ok':'ko'}">🏅 Question certification : ${cOk?'réussie':'à revoir'}</span></div>
 <div class="rev"><h3>Revoir mes réponses</h3>${[...MAIN,CERT].map(q=>{const a=S.ans[q.n],ok=a===q.bonne;return`<details class="ri ${ok?'ok':'ko'}"${ok?'':' open'}><summary><span class="st">${ok?'✓':'✕'}</span>${q.certif?'★ ':q.n+'. '}${q.titre}<span class="ch">›</span></summary><div class="rb"><span class="ans">✅ ${q.opts[q.bonne]}</span>${q.expl}</div></details>`}).join('')}</div>
 <div class="cta" style="gap:10px;flex-wrap:wrap;padding-top:14px"><button class="btn" id="again">🔁 Refaire le quiz</button>${pass?'':'<button class="btn ghost" id="home">Accueil</button>'}</div></section>
 <p class="foot">Quiz M1.2 A · Du prompt au contexte · Studeria Work with AI</p>`;
 $('#again').onclick=()=>{S.ans={};show(0)};const h=$('#home');if(h)h.onclick=home;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#arc').setAttribute('stroke-dasharray',(C*frac)+' '+C)}));
 let v=0;const t=setInterval(()=>{v++;if(v>sc){clearInterval(t);return}$('#scv').textContent=v},Math.max(40,900/Math.max(1,sc)));
 if(pass)setTimeout(()=>burst(160),500);window.scrollTo({top:0,behavior:'smooth'})}

/* ---------- clavier ---------- */
addEventListener('keydown',e=>{if(S.i<0||S.i>20)return;const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
 if(m!==undefined&&!S.locked){const all=[...MAIN,CERT];if(m<all[S.i].opts.length){e.preventDefault();answer(m)}}});

/* ---------- confettis ---------- */
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],raf=0;
function fit(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#7b1ad5','#a155f8','#e8bbff','#10b981','#f59e0b','#f43f5e','#06b6d4'];
 for(let i=0;i<n;i++)P.push({x:n>50?Math.random()*innerWidth:innerWidth/2+(Math.random()-.5)*120,y:n>50?-20-Math.random()*200:innerHeight*.55,vx:(Math.random()-.5)*(n>50?2:9),vy:n>50?2+Math.random()*3:-6-Math.random()*6,r:3+Math.random()*4,c:cols[i%cols.length],a:Math.random()*6,l:1});
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.l>0&&p.y<innerHeight+20);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.a+=.15;p.l-=.006;cx.save();cx.globalAlpha=Math.min(1,p.l*2);cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}
 raf=P.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

window.__quiz={answer,state:()=>({i:S.i,ans:{...S.ans}}),start:()=>{S.ans={};show(0)},Q};
home();
})();
</script>
</body>
</html>
